ver;\">\n          <span style=\"font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: rgba(12,10,9,0.42);\">03<\u002Fspan>\n          <h3 style=\"margin: 0; font-weight: 300; font-size: clamp(25px, 2.7vw, 40px); line-height: 1.04; letter-spacing: -0.026em;\">No reemplaza a tu equipo ni a tu sistema.<\u002Fh3>\n          <p style=\"margin: 0; font-size: 17px; line-height: 1.65; color: rgba(12,10,9,0.62); text-wrap: pretty;\">Le quita lo repetitivo a tu gente para que atienda mejor. Y lo que ya usas (facturación, historia clínica, agenda) se queda: nos integramos, no lo sustituimos.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"contacto\" data-rail=\"contacto\" style=\"position: relative; z-index: 3; margin-top: -60px; border-radius: var(--adv-round) var(--adv-round) 0 0; background: #0C0A09; overflow: clip;\">\n    <div aria-hidden=\"true\" style=\"position: absolute; z-index: 0; left: 50%; bottom: -46%; width: 1200px; height: 1200px; margin-left: -600px; pointer-events: none; background: radial-gradient(closest-side, rgba(255,205,112,0.22), rgba(255,205,112,0.05) 45%, rgba(255,205,112,0) 72%); filter: blur(10px); animation: advBreath 10s ease-in-out infinite;\"><\u002Fdiv>\n    <div style=\"position: relative; z-index: 1; max-width: 1440px; margin: 0 auto; padding: clamp(120px, 15vw, 210px) var(--adv-pad) clamp(96px, 11vw, 150px); display: flex; flex-direction: column; align-items: center; text-align: center; gap: 30px;\">\n      <p style=\"margin: 0; font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; color: #FFCD70; animation: advReveal 800ms cubic-bezier(0.16,1,0.3,1) both; animation-timeline: view(); animation-range: entry 0% cover 24%;\">El primer paso<\u002Fp>\n      <h2 style=\"margin: 0; font-weight: 300; font-size: clamp(40px, 7.6vw, 120px); line-height: 0.9; letter-spacing: -0.042em; max-width: 15ch; text-wrap: balance; animation: advMask 1000ms cubic-bezier(0.16,1,0.3,1) both; animation-timeline: view(); animation-range: entry 0% cover 26%;\">Empecemos por ver tu <span style=\"font-family: var(--font-serif-accent); font-style: italic; color: #FFCD70;\">operación<\u002Fspan>.<\u002Fh2>\n      <p style=\"margin: 0; max-width: 54ch; font-size: clamp(16px, 1.5vw, 21px); line-height: 1.6; color: rgba(255,253,248,0.68); text-wrap: pretty; animation: advReveal 900ms cubic-bezier(0.16,1,0.3,1) 120ms both; animation-timeline: view(); animation-range: entry 0% cover 24%;\">Una llamada de 30 minutos para entender cómo trabaja tu negocio. Si vemos que podemos ayudarte, te lo decimos con números. Si no, también te lo decimos.<\u002Fp>\n      <a href=\"https://calendar.app.google/mPLfXKLes5QQEQCo7\" target=\"_blank\" rel=\"noopener\" style=\"margin-top: 14px; display: inline-flex; align-items: center; gap: 14px; padding: 19px 40px; border-radius: 999px; background: #FFCD70; color: #0C0A09; font-size: 19px; box-shadow: 0 0 56px rgba(255,205,112,0.26); transition: background 140ms linear, gap 240ms cubic-bezier(0.22,0.61,0.36,1); animation: advReveal 900ms cubic-bezier(0.16,1,0.3,1) 200ms both; animation-timeline: view(); animation-range: entry 0% cover 24%;\" style-hover=\"background: #FFD98A; color: #0C0A09; gap: 22px;\">Agendar diagnóstico <span aria-hidden=\"true\">→<\u002Fspan><\u002Fa>\n      <span style=\"font-size: 13px; color: rgba(255,253,248,0.45);\">30 minutos. Sin compromiso.<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <footer style=\"position: relative; z-index: 3; background: #0C0A09; border-top: 1px solid rgba(255,253,248,0.08);\">\n    <div style=\"max-width: 1440px; margin: 0 auto; padding: 38px var(--adv-pad); display: flex; flex-wrap: wrap; gap: 20px; justify-content: space-between; align-items: center; font-size: 12px; letter-spacing: 0.06em; color: rgba(255,253,248,0.42);\">\n      <span>Advantio · República Dominicana · © 2026<\u002Fspan>\n      <a href=\"#hero\" style=\"color: rgba(255,253,248,0.42);\" style-hover=\"color: #FFCD70;\">Volver arriba ↑<\u002Fa>\n    <\u002Fdiv>\n  <\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440},&quot;paraIntensity&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1,&quot;min&quot;:0,&quot;max&quot;:1.8,&quot;step&quot;:0.1,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Experiencia&quot;},&quot;showRail&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Experiencia&quot;},&quot;openFirst&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Comportamiento&quot;}}\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    const first = props.openFirst ?? true;\n    this.state = { open: { p1: first, s1: first, c1: first }, y: 0, prog: 0, act: \"hero\", railShow: false };\n    this.lastY = 0; this.vel = 0;\n    this.keys = [\"p1\", \"p2\", \"p3\", \"s1\", \"s2\", \"s3\", \"c1\", \"c2\", \"c3\"];\n    this.rails = [\"hero\", \"problemas\", \"modelo\", \"capacidades\", \"datos\", \"claridad\", \"contacto\"];\n    this.rootRef = React.createRef();\n  }\n\n  componentDidMount() {\n    this.applyPara();\n\n    let raf = null;\n    this.onScroll = () => {\n      if (raf) return;\n      raf = requestAnimationFrame(() => {\n        raf = null;\n        const doc = document.documentElement;\n        const max = Math.max(1, doc.scrollHeight - window.innerHeight);\n        const line = window.scrollY + window.innerHeight * 0.4;\n        let act = this.rails[0];\n        const root = this.rootRef.current;\n        if (root) {\n          root.querySelectorAll(\"[data-rail]\").forEach(el => {\n            const top = el.getBoundingClientRect().top + window.scrollY;\n            if (top <= line) act = el.getAttribute(\"data-rail\") || act;\n          });\n        }\n        const prog = Math.min(1, window.scrollY / max);\n        const raw = Math.min(1, Math.abs(window.scrollY - this.lastY) / 90);\n        this.lastY = window.scrollY;\n        this.vel = this.vel * 0.82 + raw * 0.18;\n        if (root) {\n          root.style.setProperty(\"--adv-prog\", prog.toFixed(4));\n          root.style.setProperty(\"--adv-vel\", this.vel.toFixed(3));\n        }\n        if (act !== this.state.act) {\n          clearTimeout(this.railT);\n          this.railT = setTimeout(() => this.setState({ railShow: false }), 1400);\n          this.setState({ railShow: true });\n        }\n        this.setState({ y: window.scrollY, prog, act });\n      });\n    };\n    window.addEventListener(\"scroll\", this.onScroll, { passive: true });\n    this.onScroll();\n\n    const decay = () => {\n      if (this.vel > 0.002) {\n        this.vel *= 0.92;\n        const el = this.rootRef.current;\n        if (el) el.style.setProperty(\"--adv-vel\", this.vel.toFixed(3));\n      }\n      this.decayRaf = requestAnimationFrame(decay);\n    };\n    this.decayRaf = requestAnimationFrame(decay);\n\n  }\n\n  componentDidUpdate(prev) {\n    if (prev.paraIntensity !== this.props.paraIntensity) this.applyPara();\n  }\n\n  componentWillUnmount() {\n    window.removeEventListener(\"scroll\", this.onScroll);\n    clearTimeout(this.railT);\n    cancelAnimationFrame(this.decayRaf);\n  }\n\n  applyPara() {\n    const el = this.rootRef.current;\n    if (el) el.style.setProperty(\"--adv-para\", String(this.props.paraIntensity ?? 1));\n  }\n\n  toggle(k) {\n    this.setState(s => ({ open: { ...s.open, [k]: !s.open[k] } }));\n  }\n\n  renderVals() {\n    const gr = {}, rot = {}, tog = {}, ex = {}, onKey = {}, bc = {};\n    this.keys.forEach(k => {\n      const on = !!this.state.open[k];\n      gr[k] = on ? \"1fr\" : \"0fr\";\n      rot[k] = on ? \"45deg\" : \"0deg\";\n      ex[k] = on ? \"true\" : \"false\";\n      bc[k] = on ? \"rgba(255,205,112,0.65)\" : \"rgba(255,253,248,0.16)\";\n      tog[k] = () => this.toggle(k);\n      onKey[k] = e => {\n        if (e.key === \"Enter\" || e.key === \" \" || e.key === \"Spacebar\") {\n          e.preventDefault();\n          this.toggle(k);\n        }\n      };\n    });\n\n    const rw = {}, rc = {};\n    this.rails.forEach(id => {\n      const on = this.state.act === id;\n      rw[id] = on ? \"46px\" : \"16px\";\n      rc[id] = on ? \"#FFCD70\" : \"rgba(255,253,248,0.24)\";\n    });\n\n    const scrolled = this.state.y > 30;\n    return {\n      gr, rot, tog, ex, onKey, rw, rc, bc,\n      rootRef: this.rootRef,\n      progScale: this.state.prog.toFixed(4),\n      navBg: scrolled ? \"rgba(12,10,9,0.86)\" : \"rgba(12,10,9,0)\",\n      navBorder: scrolled ? \"rgba(255,253,248,0.08)\" : \"rgba(255,253,248,0)\",\n      railOn: this.props.showRail ?? true,\n      railOpacity: this.state.railShow ? 1 : 0\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
